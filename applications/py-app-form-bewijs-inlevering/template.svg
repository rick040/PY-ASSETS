<title>py-app-form-bewijs-inlevering: Bewijs van inlevering toegangsmiddel</title>
<g id="py-app-form-bewijs-inlevering-template"><rect x="0" y="0" width="154" height="111" fill="#FFFFFF" id="bleed-background"/><g id="title" data-variable="title"><text x="11.111" y="17.212" font-family="Ubuntu Medium" font-size="7.056" fill="#1A3580" xml:space="preserve">Bewijs van inlevering</text><text x="11.111" y="24.267" font-family="Ubuntu" font-size="7.056" font-weight="bold" fill="#1A3580" xml:space="preserve">toegangsmiddel</text></g><g id="variables"><g id="body-1" data-variable="body-1"><text x="11.111" y="34.851" font-family="Ubuntu" font-size="4.586" fill="#1A3580" xml:space="preserve">ParkingYou bevestigt hierbij de ontvangst van het</text><text x="11.111" y="40.354" font-family="Ubuntu" font-size="4.586" fill="#1A3580" xml:space="preserve">toegangsmiddel dat hoort bij het abonnement van</text><text x="11.111" y="45.857" font-family="Ubuntu" font-size="4.586" fill="#1A3580" xml:space="preserve">onderstaande klant.</text></g><g id="body-2" data-variable="body-2"><text x="11.111" y="53.861" font-family="Ubuntu" font-size="4.586" fill="#1A3580" xml:space="preserve">De bijbehorende borg wordt, na verwerking, teruggestort</text><text x="11.111" y="59.364" font-family="Ubuntu" font-size="4.586" fill="#1A3580" xml:space="preserve">conform de geldende voorwaarden.</text></g></g><g id="py-atom-field-date-segmented"><g data-element="py-atom-field-date-segmented" transform="translate(104.308 11.605) scale(1 1)"><path d="M8.859 0.132L5.998 0.132L4.996 1.134L3.995 0.132L1.134 0.132L0.132 1.134L0.132 6.259L1.134 7.26L3.995 7.26L4.996 6.259L5.998 7.26L8.859 7.26L9.86 6.259L9.86 1.134L8.859 0.132" fill="none" stroke="#1A3580" stroke-width="0.265"/><path d="M18.586 0.132L15.725 0.132L14.724 1.134L13.722 0.132L10.861 0.132L9.86 1.134L9.86 6.259L10.861 7.26L13.722 7.26L14.724 6.259L15.725 7.26L18.586 7.26L19.588 6.259L19.588 1.134L18.586 0.132" fill="none" stroke="#1A3580" stroke-width="0.265"/><path d="M38.042 0.132L35.181 0.132L34.179 1.134L33.178 0.132L30.317 0.132L