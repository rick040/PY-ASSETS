<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><rect width="420" height="297" fill="#FFFFFF"/><g id="page-chrome" opacity="0.9999"><text x="15" y="14" font-family="Ubuntu" font-size="3.2" fill="#32B9CD" font-weight="bold" xml:space="preserve">PRINT-ELEMENTEN</text><text x="15" y="24" font-family="Ubuntu" font-size="8.5" fill="#1A3580" font-weight="bold" xml:space="preserve">Nieuwe atomen (1/3)</text><text x="15" y="30" font-family="Ubuntu" font-size="3.2" fill="#8C8C8C" xml:space="preserve">Elk element op eigen schaal (past in zijn cel); echte maat staat in het label. [third-party] = alleen referentie, officieel bestand ophalen.</text><text x="405" y="14" font-family="Ubuntu" font-size="3.2" fill="#8C8C8C" text-anchor="end" xml:space="preserve">parkingyou toepassingen-overzicht</text><text x="15" y="289" font-family="Ubuntu" font-size="2.469" fill="#8C8C8C" xml:space="preserve">Bron: tien printbestanden (source/print). Referentie = getrouwe vectorweergave; template = officiele tokenkleuren, 3 mm bleed, variabelen als live tekst. Labels staan in aparte groepen.</text><text x="405" y="289" font-family="Ubuntu" font-size="4" fill="#1A3580" font-weight="bold" text-anchor="end" xml:space="preserve">24</text></g><g id="py-atom-badge-round-navy" opacity="0.9999"><g transform="translate(30.973 40) scale(1.543)"><g id="py-atom-badge-round-navy"><path d="M17.997 35.995C27.937 35.995 35.995 27.937 35.995 17.997C35.995 8.058 27.937 0 17.997 0C8.058 0 0 8.058 0 17.997C0 27.937 8.058 35.995 17.997 35.995" fill="#1A3580"/></g></g></g><g id="label-py-atom-badge-round-navy-1" opacity="0.9999"><text x="58.75" y="101.023" font-family="Ubuntu" font-size="2.469" fill="#8C8C8C" text-anchor="middle" xml:space="preserve">py-atom-badge-round-navy</text><text x="58.75" y="104.184" font-family="Ubuntu" font-size="2.469" fill="#8C8C8C" text-anchor="middle" xml:space="preserve">Ronde badge navy 36 x 36 mm</text></g><g id="py-atom-badge-square-navy" op