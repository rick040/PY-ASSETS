t-size="2.469" fill="#8C8C8C" text-anchor="middle" xml:space="preserve">parkeerkaart</text></g><g id="spec-py-app-sticker-terminal-gele-knop-parkeerkaart" opacity="0.9999"><text x="15" y="252.469" font-family="Ubuntu" font-size="2.469" fill="#1A3580" font-weight="bold" xml:space="preserve">Specificatie</text><text x="15" y="255.927" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Bron: nieuw ontwerp, geen printbestand en geen referentie. Template: trim 123.32 x 83.67 mm, bleed 3 mm, totaal 129.32 x 89.67 mm.</text><text x="15" y="259.581" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Variabelen: text-1 = Druk op de gele knop; text-2 = voor een parkeerkaart</text><text x="15" y="263.236" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Snijcontour: groep cut-contour, spot ThruCut, 1 pt, 0.2 mm binnen de trim. Proposal: new design without a die line; radius taken from the scan stickers of the sheet (4.65 mm). To be confirmed by the printer.</text><text x="15" y="266.891" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">'Druk op de gele knop voor een parkeerkaart': two centred lines of navy text ('gele knop' and 'parkeerkaart' bold), then the yellow ticket button of the terminal, an arrow and the parking ticket. The yellow of the button is a functional colour (observed token py-obs-geel-knop), to be matched to the real terminal button. New design after the sheet, no</text><text x="15" y="270.052" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">print source and no reference. Look and sizes follow the sheet: white sticker, navy Ubuntu text, navy line icons, hairline contour as ThruCut 0.2 mm inside the trim, 3 mm bleed. Corner radius 4.65 mm is taken from the scan stickers and is a proposal.</text></g></svg>