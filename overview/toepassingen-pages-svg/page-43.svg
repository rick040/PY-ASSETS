 measured on the die line, to be confirmed by the printer.</text><text x="15" y="266.891" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Pill sticker (full radius) with a navy round icon badge (headset or phone) and the phone number in navy Ubuntu Bold 9.56 mm. Two variants on the sheet, same size. Sheet TerminalStickers_September2026.pdf (271 x 391 mm, no bleed, no trim marks): a hairline die line (black, 0.25 to 0.74 pt) around each white sticker. The template replaces that line</text><text x="15" y="270.052" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">by a ThruCut contour 0.2 mm inside the trim and adds a 3 mm bleed. Source blue CMYK 99.5/85/21.4/6.8 (drift, see tokens.json observed): the template uses the token blue.</text></g></svg>