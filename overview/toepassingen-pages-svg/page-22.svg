t x="3.42" y="6.75" font-family="Ubuntu" font-size="2.7" font-weight="bold" text-anchor="middle" fill="#FFFFFF" id="country" xml:space="preserve">NL</text><text x="8.6" y="8" font-family="Ubuntu" font-size="6.2" font-weight="bold" fill="#1A3580" data-variable="kenteken-voorbeeld" id="plate-text" xml:space="preserve">12-AB-3</text><rect x="32.917" y="2.4" width="0.8" height="6.7" fill="#1A3580" id="cursor"/></g></g></g></g><g id="label-py-atom-icon-kenteken-invoer-18" opacity="0.9999"><text x="375.25" y="119.169" font-family="Ubuntu" font-size="2.469" fill="#8C8C8C" text-anchor="middle" xml:space="preserve">py-atom-icon-kenteken-invoer</text></g><g id="spec-py-app-sticker-terminal-kenteken-invoeren" opacity="0.9999"><text x="15" y="252.469" font-family="Ubuntu" font-size="2.469" fill="#1A3580" font-weight="bold" xml:space="preserve">Specificatie</text><text x="15" y="255.927" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Bron: nieuw ontwerp, geen printbestand en geen referentie. Template: trim 120 x 33.76 mm, bleed 3 mm, totaal 126 x 39.76 mm.</text><text x="15" y="259.581" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Variabelen: text-1 = Voer hier uw; text-2 = kenteken in</text><text x="15" y="263.236" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Snijcontour: groep cut-contour, spot ThruCut, 1 pt, 0.2 mm binnen de trim. Proposal: new design without a die line; radius taken from the scan stickers of the sheet (4.65 mm). To be confirmed by the printer.</text><text x="15" y="266.891" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">'Voer hier uw kenteken in': two lines of navy text ('kenteken' bold), a keypad icon and a licence plate with an input cursor. New design after the sheet, no print source and no reference. Look and sizes follow the sheet: white sticker, navy Ubuntu text, navy line icons, hairline contour as ThruCut 0.2 mm inside the trim, 3 mm bleed. Corner radius 4.65</text><text x="15" y="270.052" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">mm is taken from the scan stickers and is a proposal.</text></g></svg>