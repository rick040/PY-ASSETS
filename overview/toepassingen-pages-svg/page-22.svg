.469" fill="#8C8C8C" text-anchor="middle" xml:space="preserve">py-tok-type-ubuntu-regular</text></g><g id="py-app-sticker-terminal-info-built-py-tok-type-ubuntu-bold" opacity="0.9999"><g transform="translate(353.5 74) scale(0.778)"><g id="py-tok-type-ubuntu-bold"><text x="-0.12" y="9.308" font-family="Ubuntu" font-size="11.994" font-weight="bold" fill="#1A3580" xml:space="preserve">Aa Bb 123</text><text x="-0.12" y="15.658" font-family="Ubuntu" font-size="4.586" font-weight="bold" fill="#1D1D1B" xml:space="preserve">Ubuntu Bold</text></g></g></g><g id="label-py-tok-type-ubuntu-bold-15" opacity="0.9999"><text x="375.25" y="89.903" font-family="Ubuntu" font-size="2.469" fill="#8C8C8C" text-anchor="middle" xml:space="preserve">py-tok-type-ubuntu-bold</text></g><g id="py-app-sticker-terminal-info-built-py-atom-icon-info-bubble" opacity="0.9999"><g transform="translate(317.118 104) scale(0.501)"><g id="py-atom-icon-info-bubble"><path d="M13.237 0C5.926 0 0 5.926 0 13.236C0 25.52 12.275 31.677 12.275 31.677C12.696 31.934 13.237 31.627 13.237 31.133L13.237 26.472C20.548 26.472 26.475 20.546 26.475 13.236C26.475 5.926 20.548 0 13.237 0" fill="#1A3580"/><text x="9.856" y="22.282" font-family="Ubuntu" font-size="23.395" font-weight="bold" fill="#FFFFFF" xml:space="preserve">i</text></g></g></g><g id="label-py-atom-icon-info-bubble-17" opacity="0.9999"><text x="323.75" y="123.669" font-family="Ubuntu" font-size="2.469" fill="#8C8C8C" text-anchor="middle" xml:space="preserve">py-atom-icon-info-bubble</text></g><g id="spec-py-app-sticker-terminal-info" opacity="0.9999"><text x="15" y="252.469" font-family="Ubuntu" font-size="2.469" fill="#1A3580" font-weight="bold" xml:space="preserve">Specificatie</text><text x="15" y="255.927" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Bron: TerminalStickers_September2026.pdf p1 (CMYK; bleed box in bron nee). Template: trim 26.4 x 32 mm, bleed 3 mm, totaal 32.4 x 38 mm.</text><text x="15" y="259.581" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Variabelen: colour = #1A3580</text><text x="15" y="263.236" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Snijcontour: groep cut-contour, spot ThruCut, 1 pt, 0.2 mm binnen de trim. Proposal: the die contour follows the bubble outline exactly (free shape, no inset); the source has no die line for this sticker. To be confirmed by the printer.</text><text x="15" y="266.891" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Die cut sticker in the shape of the bubble, navy with a white i, no die line in the source. The cut-contour group is the bubble outline traced from the source path. Sheet TerminalStickers_September2026.pdf (271 x 391 mm, no bleed, no trim marks): a hairline die line (black, 0.25 to 0.74 pt) around each white sticker. The template replaces that line by a</text><text x="15" y="270.052" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">ThruCut contour 0.2 mm inside the trim and adds a 3 mm bleed. Source blue CMYK 99.5/85/21.4/6.8 (drift, see tokens.json observed): the template uses the token blue.</text></g></svg>