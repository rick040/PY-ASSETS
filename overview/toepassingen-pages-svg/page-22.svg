24L3.503 0.619L2.251 0" fill="#1A3580"/></g></g></g><g id="label-py-atom-arrow-left-solid-15" opacity="0.9999"><text x="375.25" y="84.154" font-family="Ubuntu" font-size="2.469" fill="#8C8C8C" text-anchor="middle" xml:space="preserve">py-atom-arrow-left-solid</text></g><g id="spec-py-app-sticker-terminal-pijl-links" opacity="0.9999"><text x="15" y="252.469" font-family="Ubuntu" font-size="2.469" fill="#1A3580" font-weight="bold" xml:space="preserve">Specificatie</text><text x="15" y="255.927" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Bron: TerminalStickers_September2026.pdf p1 (CMYK; bleed box in bron nee). Template: trim 12.09 x 12.09 mm, bleed 3 mm, totaal 18.09 x 18.09 mm.</text><text x="15" y="259.581" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Variabelen: arrow-direction = links</text><text x="15" y="263.236" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Snijcontour: groep cut-contour, spot ThruCut, 1 pt, 0.2 mm binnen de trim. Proposal: the source has only a 0.25 pt hairline as die line, no ThruCut contour. Radius measured on the die line, to be confirmed by the printer.</text><text x="15" y="266.891" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Round sticker 12.1 mm, navy arrow 6.5 mm, no text. The sheet holds the sticker twice, identical. Sheet TerminalStickers_September2026.pdf (271 x 391 mm, no bleed, no trim marks): a hairline die line (black, 0.25 to 0.74 pt) around each white sticker. The template replaces that line by a ThruCut contour 0.2 mm inside the trim and adds a 3 mm bleed.</text><text x="15" y="270.052" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Source blue CMYK 99.5/85/21.4/6.8 (drift, see tokens.json observed): the template uses the token blue.</text></g></svg>