308" font-family="Ubuntu" font-size="11.994" fill="#1A3580" xml:space="preserve">Aa Bb 123</text><text x="-0.096" y="15.658" font-family="Ubuntu" font-size="4.586" fill="#1D1D1B" xml:space="preserve">Ubuntu Regular</text></g></g></g><g id="label-py-tok-type-ubuntu-regular-13" opacity="0.9999"><text x="323.75" y="91.019" font-family="Ubuntu" font-size="2.469" fill="#8C8C8C" text-anchor="middle" xml:space="preserve">py-tok-type-ubuntu-regular</text></g><g id="py-app-sticker-terminal-bankpas-voorhouden-built-py-tok-type-ubuntu-bold" opacity="0.9999"><g transform="translate(353.5 74) scale(0.778)"><g id="py-tok-type-ubuntu-bold"><text x="-0.12" y="9.308" font-family="Ubuntu" font-size="11.994" font-weight="bold" fill="#1A3580" xml:space="preserve">Aa Bb 123</text><text x="-0.12" y="15.658" font-family="Ubuntu" font-size="4.586" font-weight="bold" fill="#1D1D1B" xml:space="preserve">Ubuntu Bold</text></g></g></g><g id="label-py-tok-type-ubuntu-bold-15" opacity="0.9999"><text x="375.25" y="89.903" font-family="Ubuntu" font-size="2.469" fill="#8C8C8C" text-anchor="middle" xml:space="preserve">py-tok-type-ubuntu-bold</text></g><g id="py-app-sticker-terminal-bankpas-voorhouden-built-py-atom-icon-arrow-down-circle" opacity="0.9999"><g transform="translate(319.883 104) scale(1)"><g id="py-atom-icon-arrow-down-circle"><path d="M7.734 3.867C7.734 1.731 6.003 0 3.867 0C1.731 0 0 1.731 0 3.867C0 6.003 1.731 7.734 3.867 7.734C6.003 7.734 7.734 6.003 7.734 3.867" fill="#1A3580"/><path d="M1.455 4.605L3.872 6.279L6.279 4.605L5.818 3.674L4.474 4.44L4.38 1.455L3.351 1.455L3.258 4.435L1.915 3.674L1.455 4.605" fill="#FFFFFF"/></g></g></g><g id="label-py-atom-icon-arrow-down-circle-17" opacity="0.9999"><text x="323.75" y="115.403" font-family="Ubuntu" font-size="2.469" fill="#8C8C8C" text-anchor="middle" xml:space="preserve">py-atom-icon-arrow-down-circle</text></g><g id="spec-py-app-sticker-terminal-bankpas-voorhouden" opacity="0.9999"><text x="15" y="252.469" font-family="Ubuntu" font-size="2.469" fill="#1A3580" font-weight="bold" xml:space="preserve">Specificatie</text><text x="15" y="255.927" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Bron: TerminalStickers_September2026.pdf p1 (CMYK; bleed box in bron nee). Template: trim 85 x 43 mm, bleed 3 mm, totaal 91 x 49 mm.</text><text x="15" y="259.581" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Variabelen: background-colour = #1A3580; text-1 = Bankpas minimaal; text-2 = 3 seconden voorhouden</text><text x="15" y="263.236" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Snijcontour: groep cut-contour, spot ThruCut, 1 pt, 0.2 mm binnen de trim. Proposal: the source has only a 0.25 pt hairline as die line, no ThruCut contour. Radius measured on the die line, to be confirmed by the printer.</text><text x="15" y="266.891" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Navy sticker, white text centred ('3 seconden' bold), arrow in a white disc. The arrow icon is the library atom with the colours swapped. Die line 0.5 pt. Sheet TerminalStickers_September2026.pdf (271 x 391 mm, no bleed, no trim marks): a hairline die line (black, 0.25 to 0.74 pt) around each white sticker. The template replaces that line by a ThruCut</text><text x="15" y="270.052" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">contour 0.2 mm inside the trim and adds a 3 mm bleed. Source blue CMYK 99.5/85/21.4/6.8 (drift, see tokens.json observed): the template uses the token blue.</text></g></svg>