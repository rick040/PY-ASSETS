<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><rect width="420" height="297" fill="#FFFFFF"/><g id="page-chrome" opacity="0.9999"><text x="15" y="14" font-family="Ubuntu" font-size="3.2" fill="#32B9CD" font-weight="bold" xml:space="preserve">TOEPASSING</text><text x="15" y="24" font-family="Ubuntu" font-size="8.5" fill="#1A3580" font-weight="bold" xml:space="preserve">Terminalsticker gele knop voor parkeerkaart (klein, alleen tekst)</text><text x="15" y="30" font-family="Ubuntu" font-size="3.2" fill="#8C8C8C" xml:space="preserve">py-app-sticker-terminal-gele-knop-tekst   |   type sticker   |   trim 100 x 11 mm, bleed 3 mm   |   status rebuilt</text><text x="405" y="14" font-family="Ubuntu" font-size="3.2" fill="#8C8C8C" text-anchor="end" xml:space="preserve">parkingyou toepassingen-overzicht</text><text x="15" y="289" font-family="Ubuntu" font-size="2.469" fill="#8C8C8C" xml:space="preserve">Bron: elf printbestanden (source/print). Referentie = getrouwe vectorweergave; template = officiele tokenkleuren, 3 mm bleed, variabelen als live tekst. Labels staan in aparte groepen.</text><text x="405" y="289" font-family="Ubuntu" font-size="4" fill="#1A3580" font-weight="bold" text-anchor="end" xml:space="preserve">21</text></g><g id="frame-py-app-sticker-terminal-gele-knop-tekst-template" opacity="0.9999"><rect x="15" y="40" width="281" height="45.066" fill="none" stroke="#D0D0D0" stroke-width="0.2"/></g><g id="py-app-sticker-terminal-gele-knop-tekst-template" opacity="0.9999"><g transform="translate(15 40) scale(2.651)"><g id="py-app-sticker-terminal-gele-knop-tekst-template"><text x="7.539" y="10" font-family="Ubuntu" font-size="4.4" fill="#1A3580" data-variable="text" xml:space="preserve">Druk op de <tspan font-family="Ubuntu" font-weight="bold">gele knop</tspan> voor een <tspan font-family="Ubuntu" font-weight="bold">parkeerkaart</tspan></text><g id="cut-contour" data-spot="ThruCut"><rect x="3.2" y="3.2" width="99.6" height="10.6" fill="none" stroke="#EE4D9B" stroke-width="0.353" rx="2.8" ry="2.8"/></g></g></g></g><g id="label-py-app-sticker-terminal-gele-knop-tekst-2" opacity="0.9999"><text x="155.5" y="89.035" font-family="Ubuntu" font-size="2.469" fill="#8C8C8C" text-anchor="middle" xml:space="preserve">py-app-sticker-terminal-gele-knop-tekst</text><text x="155.5" y="92.196" font-family="Ubuntu" font-size="2.469" fill="#8C8C8C" text-anchor="middle" xml:space="preserve">Template (nieuw ontwerp, tokenkleuren, met bleed)</text></g><g id="head-exploded" opacity="0.9999"><text x="302" y="39" font-family="Ubuntu" font-size="2.469" fill="#1A3580" font-weight="bold" xml:space="preserve">Opgebouwd uit</text></g><g id="py-app-sticker-terminal-gele-knop-tekst-built-py-tok-color-blauw" opacity="0.9999"><g transform="translate(315.75 44) scale(0.667)"><g id="py-tok-color-blauw"><path d="M23.989 11.994C23.989 18.619 18.619 23.989 11.994 23.989C5.37 23.989 0 18.619 0 11.994C0 5.37 5.37 0 11.994 0C18.619 0 23.989 5.37 23.989 11.994Z" fill="#1A3580"/></g></g></g><g id="label-py-tok-color-blauw-5" opacity="0.9999"><text x="323.75" y="63.669" font-family="Ubuntu" font-size="2.469" fill="#8C8C8C" text-anchor="middle" xml:space="preserve">py-tok-color-blauw</text></g><g id="tile-py-app-sticker-terminal-gele-knop-tekst-built-py-tok-color-wit" opacity="0.9999"><rect x="365.75" y="42.5" width="19" height="19" fill="#D9D9D9"/></g><g id="py-app-sticker-terminal-gele-knop-tekst-built-py-tok-color-wit" opacity="0.9999"><g transform="translate(367.25 44) scale(0.661)"><g id="py-tok-color-wit"><path d="M24.095 12.1C24.095 18.725 18.725 24.095 12.1 24.095C5.476 24.095 0.106 18.725 0.106 12.1C0.106 5.476 5.476 0.106 12.1 0.106C18.725 0.106 24.095 5.476 24.095 12.1Z" fill="#FFFFFF" stroke="#AEAEAE" stroke-width="0.212"/></g></g></g><g id="label-py-tok-color-wit-8" opacity="0.9999"><text x="375.25" y="63.669" font-family="Ubuntu" font-size="2.469" fill="#8C8C8C" text-anchor="middle" xml:space="preserve">py-tok-color-wit</text></g><g id="py-app-sticker-terminal-gele-knop-tekst-built-py-tok-type-ubuntu-regular" opacity="0.9999"><g transform="translate(302 74) scale(0.808)"><g id="py-tok-type-ubuntu-regular"><text x="-0.096" y="9.308" font-family="Ubuntu" font-size="11.994" fill="#1A3580" xml:space="preserve">Aa Bb 123</text><text x="-0.096" y="15.658" font-family="Ubuntu" font-size="4.586" fill="#1D1D1B" xml:space="preserve">Ubuntu Regular</text></g></g></g><g id="label-py-tok-type-ubuntu-regular-10" opacity="0.9999"><text x="323.75" y="91.019" font-family="Ubuntu" font-size="2.469" fill="#8C8C8C" text-anchor="middle" xml:space="preserve">py-tok-type-ubuntu-regular</text></g><g id="py-app-sticker-terminal-gele-knop-tekst-built-py-tok-type-ubuntu-bold" opacity="0.9999"><g transform="translate(353.5 74) scale(0.778)"><g id="py-tok-type-ubuntu-bold"><text x="-0.12" y="9.308" font-family="Ubuntu" font-size="11.994" font-weight="bold" fill="#1A3580" xml:space="preserve">Aa Bb 123</text><text x="-0.12" y="15.658" font-family="Ubuntu" font-size="4.586" font-weight="bold" fill="#1D1D1B" xml:space="preserve">Ubuntu Bold</text></g></g></g><g id="label-py-tok-type-ubuntu-bold-12" opacity="0.9999"><text x="375.25" y="89.903" font-family="Ubuntu" font-size="2.469" fill="#8C8C8C" text-anchor="middle" xml:space="preserve">py-tok-type-ubuntu-bold</text></g><g id="spec-py-app-sticker-terminal-gele-knop-tekst" opacity="0.9999"><text x="15" y="252.469" font-family="Ubuntu" font-size="2.469" fill="#1A3580" font-weight="bold" xml:space="preserve">Specificatie</text><text x="15" y="255.927" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Bron: nieuw ontwerp, geen printbestand en geen referentie. Template: trim 100 x 11 mm, bleed 3 mm, totaal 106 x 17 mm.</text><text x="15" y="259.581" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Variabelen: text = Druk op de gele knop voor een parkeerkaart</text><text x="15" y="263.236" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Snijcontour: groep cut-contour, spot ThruCut, 1 pt, 0.2 mm binnen de trim. Proposal: new design without a die line; small radius of 3 mm for a 11 mm high sticker. To be confirmed by the printer.</text><text x="15" y="266.891" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Small text only version of the gele knop sticker, to be placed above the ticket button of the terminal: one line of navy Ubuntu 4.4 mm ('gele knop' and 'parkeerkaart' bold) on a 100 x 11 mm sticker. The available space on the terminal is a guess from a photo: give the real width and height and the size follows. New design after the sheet, no print</text><text x="15" y="270.052" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">source and no reference; 3 mm bleed, ThruCut contour 0.2 mm inside the trim.</text></g></svg>