.167" y="114.154" font-family="Ubuntu" font-size="2.469" fill="#8C8C8C" text-anchor="middle" xml:space="preserve">py-atom-arrow-left-solid</text></g><g id="tile-py-app-sticker-terminal-parkbee-reservering-built-py-atom-icon-parkeerkaart" opacity="0.9999"><rect x="342.545" y="102.5" width="13.909" height="19" fill="#D9D9D9"/></g><g id="py-app-sticker-terminal-parkbee-reservering-built-py-atom-icon-parkeerkaart" opacity="0.9999"><g transform="translate(344.045 104) scale(0.727)"><g id="py-atom-icon-parkeerkaart"><g transform="translate(0 0)"><rect x="0" y="0" width="15" height="22" rx="1.6" ry="1.6" fill="#FFFFFF" stroke="#1A3580" stroke-width="0.9" id="card"/><path transform="translate(0 0)" d="M1.650 0.450H13.350A1.200 1.200 0 0 1 14.550 1.650V7.900H0.450V1.650A1.200 1.200 0 0 1 1.650 0.450Z" fill="#1A3580" id="header"/><text x="7.5" y="6.55" font-family="Ubuntu" font-size="6.6" font-weight="bold" text-anchor="middle" fill="#FFFFFF" id="p" xml:space="preserve">P</text><rect x="2.9" y="11.2" width="0.5" height="7" fill="#1A3580"/><rect x="3.9" y="11.2" width="0.9" height="7" fill="#1A3580"/><rect x="5.3" y="11.2" width="0.4" height="7" fill="#1A3580"/><rect x="6.3" y="11.2" width="0.7" height="7" fill="#1A3580"/><rect x="7.5" y="11.2" width="0.4" height="7" fill="#1A3580"/><rect x="8.4" y="11.2" width="1" height="7" fill="#1A3580"/><rect x="9.9" y="11.2" width="0.5" height="7" fill="#1A3580"/><rect x="10.8" y="11.2" width="0.4" height="7" fill="#1A3580"/><rect x="11.7" y="11.2" width="0.8" height="7" fill="#1A3580"/><rect x="13" y="11.2" width="0.5" height="7" fill="#1A3580"/></g></g></g></g><g id="label-py-atom-icon-parkeerkaart-22" opacity="0.9999"><text x="349.5" y="123.669" font-family="Ubuntu" font-size="2.469" fill="#8C8C8C" text-anchor="middle" xml:space="preserve">py-atom-icon-</text><text x="349.5" y="126.83" font-family="Ubuntu" font-size="2.469" fill="#8C8C8C" text-anchor="middle" xml:space="preserve">parkeerkaart</text></g><g id="spec-py-app-sticker-terminal-parkbee-reservering" opacity="0.9999"><text x="15" y="252.469" font-family="Ubuntu" font-size="2.469" fill="#1A3580" font-weight="bold" xml:space="preserve">Specificatie</text><text x="15" y="255.927" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Bron: nieuw ontwerp, geen printbestand en geen referentie. Template: trim 120 x 33.76 mm, bleed 3 mm, totaal 126 x 39.76 mm.</text><text x="15" y="259.581" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Variabelen: text-1 = Reservering,; text-2 = pak uw ticket</text><text x="15" y="263.236" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Snijcontour: groep cut-contour, spot ThruCut, 1 pt, 0.2 mm binnen de trim. Proposal: new design without a die line; radius taken from the scan stickers of the sheet (4.65 mm). To be confirmed by the printer.</text><text x="15" y="266.891" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">'Reservering, pak uw ticket' for ParkBee reservations: two lines of navy text ('Reservering' and 'ticket' bold), the ParkBee badge (third party mark, reference only, source the official file), an arrow and the parking ticket. New design after the sheet, no print source and no reference. Look and sizes follow the sheet: white sticker, navy Ubuntu text, navy</text><text x="15" y="270.052" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">line icons, hairline contour as ThruCut 0.2 mm inside the trim, 3 mm bleed. Corner radius 4.65 mm is taken from the scan stickers and is a proposal.</text></g></svg>