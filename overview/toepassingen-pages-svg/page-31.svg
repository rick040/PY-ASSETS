edium" font-size="11.994" fill="#1A3580" xml:space="preserve">Aa Bb 123</text><text x="-0.06" y="15.658" font-family="Ubuntu Medium" font-size="4.586" fill="#1D1D1B" xml:space="preserve">Ubuntu Medium</text></g></g></g><g id="label-py-tok-type-ubuntu-medium-15" opacity="0.9999"><text x="375.25" y="90.141" font-family="Ubuntu" font-size="2.469" fill="#8C8C8C" text-anchor="middle" xml:space="preserve">py-tok-type-ubuntu-medium</text></g><g id="spec-py-app-sticker-terminal-automaatnummer" opacity="0.9999"><text x="15" y="252.469" font-family="Ubuntu" font-size="2.469" fill="#1A3580" font-weight="bold" xml:space="preserve">Specificatie</text><text x="15" y="255.927" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Bron: TerminalStickers_September2026.pdf p1 (CMYK; bleed box in bron nee). Template: trim 58.91 x 13.05 mm, bleed 3 mm, totaal 64.91 x 19.05 mm.</text><text x="15" y="259.581" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Variabelen: background-colour = #1A3580; automaatnummer = BSG-i1</text><text x="15" y="263.236" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Snijcontour: groep cut-contour, spot ThruCut, 1 pt, 0.2 mm binnen de trim. Proposal: the source has only a 0.25 pt hairline as die line, no ThruCut contour. Radius measured on the die line, to be confirmed by the printer.</text><text x="15" y="266.891" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">Navy bar with the machine number in white Ubuntu Medium 7.06 mm (example BSG-i1). The sheet holds the sticker twice, identical. Sheet TerminalStickers_September2026.pdf (271 x 391 mm, no bleed, no trim marks): a hairline die line (black, 0.25 to 0.74 pt) around each white sticker. The template replaces that line by a ThruCut contour 0.2 mm</text><text x="15" y="270.052" font-family="Ubuntu" font-size="2.469" fill="#3C3C3B" xml:space="preserve">inside the trim and adds a 3 mm bleed. Source blue CMYK 99.5/85/21.4/6.8 (drift, see tokens.json observed): the template uses the token blue.</text></g></svg>