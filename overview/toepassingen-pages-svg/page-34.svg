<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><rect width="420" height="297" fill="#FFFFFF"/><g id="page-chrome" opacity="0.9999"><text x="15" y="14" font-family="Ubuntu" font-size="3.2" fill="#32B9CD" font-weight="bold" xml:space="preserve">PRINT-ELEMENTEN</text><text x="15" y="24" font-family="Ubuntu" font-size="8.5" fill="#1A3580" font-weight="bold" xml:space="preserve">Nieuwe atomen (1/3)</text><text x="15" y="30" font-family="Ubuntu" font-size="3.2" fill="#8C8C8C" xml:space="preserve">Elk element op eigen schaal (past in zijn cel); echte maat staat in het label. [third-party] = alleen referentie, officieel bestand ophalen.</text><text x="405" y="14" font-family="Ubuntu" font-size="3.2" fill="#8C8C8C" text-anchor="end" xml:space="preserve">parkingyou toepassingen-overzicht</text><text x="15" y="289" font-family="Ubuntu" font-size="2.469" fill="#8C8C8C" xml:space="preserve">Bron: elf printbestanden (source/print). Referentie = getrouwe vectorweergave; template = officiele tokenkleuren, 3 mm bleed, variabelen als live tekst. Labels staan in aparte groepen.</text><text x="405" y="289" font-family="Ubuntu" font-size="4" fill="#1A3580" font-weight="bold" text-anchor="end" xml:space="preserve">34</text></g><g id="py-atom-arrow-left-solid" opacity="0.9999"><g transform="translate(30.969 40) scale(8.566)"><g id="py-atom-arrow-left-solid"><path d="M2.251 0L0 3.25L2.251 6.485L3.503 5.866L2.473 4.059L6.486 3.932L6.486 2.55L2.48 2.424L3.503 0.619L2.251 0" fill="#1A3580"/></g></g></g><g id="label-py-atom-arrow-left-solid-1" opacity="0.9999"><text x="58.75" y="101.023" font-family="Ubuntu" font-size="2.469" fill="#8C8C8C" text-anchor="middle" xml:space="preserve">py-atom-arrow-left-solid</text><text x="58.75" y="104.184" font-family="Ubuntu" font-size="2.469" fill="#8C8C8C" text-anchor="middle" xml:space="preserve">Pijl links (sticker) 6.5 x 6.5 mm</text></g><g id="tile-py-atom-badge-icon-headset-navy" opacity="0.9999"><rect x="127